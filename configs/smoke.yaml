seed: 1337
device: cpu
output_dir: outputs/smoke

data:
  train: outputs/dataset.npz
  val: outputs/dataset.npz
  test: outputs/dataset.npz

model:
  pretrained: false

training:
  epochs: 1
  batch_size: 2
  lr: 0.001
  weight_decay: 0.0001
  level_weights:
    partition_64x64: 1.0
    partition_32x32: 1.0
    partition_16x16: 1.0
