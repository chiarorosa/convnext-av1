[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "convnext-av1"
version = "0.1.0"
description = "Research-grade ConvNeXt-AV1 partition decision pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pablo Rosa" }]
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "pillow>=10.0",
  "torch>=2.0",
  "torchvision>=0.15",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
onnx = ["onnx>=1.15"]

[project.scripts]
convnext-av1 = "convnext_av1.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
